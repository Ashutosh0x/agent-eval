version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: development
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    command: ["pnpm", "run", "--filter", "api", "dev"]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: development
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages:/app/packages
    ports:
      - "3001:3000" # Expose Vite dev server or similar
    command: ["pnpm", "run", "--filter", "frontend", "dev"]
